name: Ring

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to ring"
        required: true
        default: "me"
        type: choice
        options:
          - me
          - grantt

jobs:
  ring:
    runs-on: ubuntu-latest
    steps:
      - name: Ring device
        env:
          FINDMY_BEARER_TOKEN: ${{ secrets.FINDMY_BEARER_TOKEN }}
          FINDMY_URL: https://ring.cockloft.space/ring
        run: |
          curl -fsS -X POST "$FINDMY_URL" \
            -H "Authorization: Bearer $FINDMY_BEARER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"profile\": \"${{ inputs.profile }}\"}"
